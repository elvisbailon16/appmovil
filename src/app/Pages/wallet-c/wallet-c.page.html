<app-cabecera [titulo]="'Certificados'"></app-cabecera>

<ion-content>
  @if (cargando) {
    <div class="estado-center">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando certificados...</p>
    </div>
  }

  @if (error && !cargando) {
    <div class="estado-center">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <p>{{ error }}</p>
      <button class="btn-retry" (click)="cargarCertificados()">Reintentar</button>
    </div>
  }

  @if (!cargando && !error) {
    @if (inscripciones.length === 0) {
      <app-empty-state
        imageSrc="assets/icon/logo.png"
        title="Aún no tienes certificados"
        message="Cuando te inscribas y participes en eventos, tus certificados aparecerán aquí."
      ></app-empty-state>
    } @else {
      @for (inscripcion of inscripciones; track inscripcion.id) {
        <app-inscripcion class="eventos-list" [inscripcion]="inscripcion"></app-inscripcion>
      }
    }
  }
</ion-content>
