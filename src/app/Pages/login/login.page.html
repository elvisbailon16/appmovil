<!-- login.page.html -->
<ion-content [fullscreen]="true" class="login-content">

  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <div class="login-wrapper">
    <div class="login-card">

      <!-- Header con mascota -->
      <div class="card-header">
        <div class="mascot-badge">
          <img src="https://terrimeet.espam.edu.ec/images/logo.png" alt="Terri" class="mascot-img" />
        </div>
        <div class="header-text">
          <h1 class="brand-title">
            TerriMeet
            <ion-icon name="checkmark-circle" class="brand-check"></ion-icon>
          </h1>
          <p class="brand-subtitle">Ingresa para vivir la experiencia de los eventos.</p>
        </div>
      </div>

      <div class="card-divider"></div>

      <!-- Formulario -->
      <div class="card-body">
        <h2 class="section-title">Iniciar sesión</h2>

        <ion-item lines="none" class="custom-item">
          <ion-icon name="mail-outline" slot="start" class="item-icon"></ion-icon>
          <ion-input
            #email
            type="email"
            label="Email"
            labelPlacement="floating"
            placeholder="tunombre@espam.edu.ec"
            fill="outline"
            class="custom-input">
          </ion-input>
        </ion-item>

        <ion-item lines="none" class="custom-item">
          <ion-icon name="lock-closed-outline" slot="start" class="item-icon"></ion-icon>
          <ion-input
            #password
            type="password"
            label="Contraseña"
            labelPlacement="floating"
            fill="outline"
            class="custom-input">
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
        </ion-item>

        <ion-button expand="block" class="btn-primary" (click)="login(email, password)" [disabled]="cargando">
          @if (cargando) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Iniciar sesión
            <ion-icon slot="end" name="arrow-forward"></ion-icon>
          }
        </ion-button>

        <ion-button expand="block" fill="outline" class="btn-microsoft" (click)="loginMicrosoft()">
          <img src="https://www.microsoft.com/favicon.ico" class="ms-icon" alt="" />
          Microsoft
        </ion-button>

        <p class="register-text">
          ¿No tienes cuenta? <a (click)="goRegister()">Regístrate</a>
        </p>
      </div>

    </div>
  </div>

</ion-content>
