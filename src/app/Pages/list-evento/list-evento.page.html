<app-cabecera [titulo]="'Eventos'"></app-cabecera>
<ion-content>

  <div class="caja">
      <div class="search-container">
      <ion-searchbar placeholder="Buscar eventos..." [value]="terminoBusqueda" (ionInput)="buscar($any($event).detail.value)" debounce="250"></ion-searchbar>
    </div>

    <div class="button-container">
      <span class="tab" [class.active]="selectedTab === 'todos'" (click)="selectTab('todos')">
        Todos
      </span>
      <span class="tab" [class.active]="selectedTab === 'mis-eventos'" (click)="selectTab('mis-eventos')">
        Mis eventos
      </span>
    </div>
  </div>

  <div class="tab-indicator-wrap">
    <hr class="linea-base">
    <div class="linea-activa" [class.right]="selectedTab === 'mis-eventos'"></div>
  </div>



  <!-- Cargando -->
  @if (cargando) {
    <div class="estado-center">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando eventos...</p>
    </div>
  }

  <!-- Error -->
  @if (error && !cargando) {
    <div class="estado-center">
      <p>{{ error }}</p>
      <button class="btn-retry" (click)="recargar()">Reintentar</button>
    </div>
  }

  <!-- Sin eventos -->
  @if (!cargando && !error && eventos.length === 0) {
        <app-empty-state
          imageSrc="assets/icon/logo.png"
          [title]="terminoBusqueda ? 'Sin resultados' : 'Aún no hay eventos'"
          [message]="terminoBusqueda ? 'No encontramos eventos que coincidan con &quot;' + terminoBusqueda + '&quot;.' : 'Cuando se publiquen nuevos eventos institucionales, los verás aquí.'"
        ></app-empty-state>
  }@else{
    @for (evento of eventos; track evento.id) {
      <app-evento class="eventos-list" [evento]="evento"></app-evento>
    }
  }

  

  <ion-infinite-scroll (ionInfinite)="onIonInfinite($event)">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>

</ion-content>
