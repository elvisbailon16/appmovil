<!-- certificados.page.html -->
<app-cabecera [titulo]="nombreEvento ? ('Certificados · ' + nombreEvento) : 'Certificados'"></app-cabecera>

<ion-content>

  @if (cargando) {
    <div class="estado-center">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando certificados...</p>
    </div>
  }

  @if (!cargando && !error && certificados) {
    @if (certificados.length === 0) {
      <app-empty-state
        icon="ribbon-outline"
        imageSrc="assets/icon/logo.png"
        title="Sin certificados"
        message="Este evento todavía no tiene certificados disponibles para descargar."
      ></app-empty-state>
    } @else {
      <div class="cert-grid">
        @for (cert of certificados; track cert.id) {
          <app-certificado [certificado]="cert"></app-certificado>
        }
      </div>
    }
  }

  @if (!cargando && !certificados) {
    <app-empty-state
      icon="alert-circle-outline"
      imageSrc="assets/icon/logo.png"
      title="No encontrado"
      message="No pudimos encontrar este evento entre tus certificados."
    ></app-empty-state>
  }

</ion-content>
