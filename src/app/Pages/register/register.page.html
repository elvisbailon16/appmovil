<!-- register.page.html -->
<ion-content [fullscreen]="true" class="register-content">

  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <div class="register-wrapper">
    <div class="register-card">

      <div class="card-header">
        <div class="mascot-badge">
          <img src="assets/img/terri-mascot.png" alt="Terri" />
        </div>
        <div class="header-text">
          <h1 class="brand-title">
            TerriMeet
            <ion-icon name="checkmark-circle"></ion-icon>
          </h1>
          <p class="brand-subtitle">Crea tu cuenta para gestionar y vivir los eventos.</p>
        </div>
      </div>

      <div class="card-divider"></div>

      <div class="card-body">
        <h2 class="section-title">Crear cuenta</h2>

        <ion-item lines="none" class="custom-item">
          <ion-icon name="card-outline" slot="start" class="item-icon"></ion-icon>
          <ion-input
            #identificacion
            type="text"
            label="Identificación"
            labelPlacement="floating"
            placeholder="Cédula o pasaporte"
            fill="outline"
            class="custom-input">
          </ion-input>
        </ion-item>

        <ion-item lines="none" class="custom-item">
          <ion-icon name="person-outline" slot="start" class="item-icon"></ion-icon>
          <ion-input
            #nombres
            type="text"
            label="Apellidos y nombres"
            labelPlacement="floating"
            placeholder="Apellidos y nombres"
            fill="outline"
            class="custom-input">
          </ion-input>
        </ion-item>

        <ion-item lines="none" class="custom-item">
          <ion-icon name="mail-outline" slot="start" class="item-icon"></ion-icon>
          <ion-input
            #correo
            type="email"
            label="Correo"
            labelPlacement="floating"
            placeholder="tunombre@espam.edu.ec"
            fill="outline"
            class="custom-input">
          </ion-input>
        </ion-item>

        <ion-item lines="none" class="custom-item">
          <ion-icon name="lock-closed-outline" slot="start" class="item-icon"></ion-icon>
          <ion-input
            #password
            type="password"
            label="Contraseña"
            labelPlacement="floating"
            fill="outline"
            class="custom-input">
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
        </ion-item>

        <ion-item lines="none" class="custom-item">
          <ion-icon name="checkmark-outline" slot="start" class="item-icon"></ion-icon>
          <ion-input
            #confirmPassword
            type="password"
            label="Confirmar contraseña"
            labelPlacement="floating"
            fill="outline"
            class="custom-input">
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
        </ion-item>

        <ion-item lines="none" class="terms-item">
          <ion-checkbox slot="start" [(ngModel)]="aceptaTerminos" class="terms-checkbox"></ion-checkbox>
          <ion-label class="terms-label">
            Acepto <a (click)="openTerms($event)">términos y condiciones</a>
          </ion-label>
        </ion-item>

        <ion-button
          expand="block"
          class="btn-primary"
          [disabled]="cargando || !aceptaTerminos"
          >
          @if (cargando) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Crear cuenta
            <ion-icon slot="end" name="arrow-forward"></ion-icon>
          }
        </ion-button>

        <p class="login-text">
          ¿Ya tienes cuenta? <a (click)="goLogin()">Inicia sesión</a>
        </p>
      </div>

    </div>
  </div>

</ion-content>
