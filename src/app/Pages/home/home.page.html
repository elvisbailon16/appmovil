<ion-header class="header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <div class="brand-text">
        <span class="title">Terrimeet</span>
        <span class="title2">ESPAM MFL</span>
      </div>
    </ion-buttons>

    
  </ion-toolbar>
</ion-header>
<ion-content>
  <div class="welcome-text">
    <h2>Hola {{ usuario?.name }}</h2>
    <p>Bienvenido, disfruta de tus eventos favoritos</p>
  </div>
  <app-destacados-event></app-destacados-event>
  <app-categorias (categoriaSeleccionada)="onCategoriaSeleccionada($event)"></app-categorias>
  <!-- @for (evento of eventos; track evento.id) {
    <app-evento class="eventos-list" [evento]="evento"></app-evento>
  } -->
      <!-- Sin eventos -->
  @if (!cargando && !error && eventos.length === 0) {
        <app-empty-state
          imageSrc="assets/icon/logo.png"
          title="Aún no hay eventos"
          message="Cuando se publiquen nuevos eventos institucionales, los verás aquí."
        ></app-empty-state>
  }@else{
    @for (evento of eventos; track evento.id) {
      <app-evento class="eventos-list" [evento]="evento"></app-evento>
    }
  }
<ion-infinite-scroll (ionInfinite)="onIonInfinite($event)">
  <ion-infinite-scroll-content></ion-infinite-scroll-content>
</ion-infinite-scroll>
</ion-content>
